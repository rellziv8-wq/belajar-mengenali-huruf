<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC Kids Indonesia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{background:#FFB300;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:500px;min-height:100vh;background:linear-gradient(#87CEEB 0% 35%, #FFF8E1 35%);position:relative;display:flex;flex-direction:column}
#intro{position:absolute;inset:0;background:linear-gradient(180deg,#FFEB3B 0%, #FF9800 100%);z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.intro-apple{font-size:90px;animation:pop 1s ease infinite alternate}
.intro-title{font-size:42px;font-weight:700;line-height:1;text-shadow:3px 3px 0 white}
.intro-title span{color:#E53935}
.intro-sub{margin-top:14px;background:#000;color:white;padding:8px 18px;border-radius:20px;font-size:14px;letter-spacing:2px}
.intro-tagline{margin-top:20px;background:white;border:4px solid #000;padding:12px 20px;border-radius:16px;box-shadow:0 6px 0 #000;font-size:16px}
.intro-play{margin-top:24px;background:#43A047;color:white;border:4px solid #000;padding:16px 40px;border-radius:18px;font-size:22px;font-weight:700;box-shadow:0 8px 0 #000;cursor:pointer}
.intro-play:active{transform:translateY(6px);box-shadow:0 2px 0 #000}
.farrel{margin-top:28px;font-size:22px;font-weight:800;letter-spacing:2px;background:white;border:4px solid #000;padding:10px 24px;border-radius:14px;box-shadow:0 6px 0 #000}
@keyframes pop{0%{transform:scale(1)}100%{transform:scale(1.15) rotate(-5deg)}}
header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:3px solid #000}
.top-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:white}
.letter-btn{min-width:44px;height:44px;border:3px solid #000;border-radius:12px;background:white;display:flex;justify-content:center;align-items:center;font-weight:700;flex-shrink:0}
.letter-btn.active{background:#FFEB3B;transform:scale(1.1)}
#canvas-wrap{flex:1;margin:10px;background:white;border:4px solid #000;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 8px 0 #000;min-height:380px}
canvas{width:100%;height:100%;touch-action:none;display:block}
#guide{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:180px;font-weight:700;pointer-events:none;opacity:.35}
#object-area{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;background:#E8F5E9;border:3px solid #000;border-radius:14px;padding:8px 12px}
.controls{display:flex;gap:8px;padding:12px}
.btn{flex:1;padding:14px;border:3px solid #000;border-radius:14px;font-weight:700;box-shadow:0 5px 0 #000}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn-clear{background:#FFCDD2}.btn-sound{background:#BBDEFB}.btn-next{background:#A5D6A7}
.stars{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.star{font-size:24px;opacity:.2}.star.on{opacity:1}
#win{position:absolute;inset:0;background:rgba(255,255,255,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
<div id="intro">
<div class="intro-apple">🍎</div>
<div class="intro-title">ABC KIDS<br><span>INDONESIA</span></div>
<div class="intro-sub">BELAJAR ABC</div>
<div class="intro-tagline">✨ Belajar Sambil Bermain ✨</div>
<button class="intro-play" id="playBtn">MAIN ▶</button>
<div class="farrel">FARREL STUDIO</div>
</div>

<header>
<div style="display:flex;gap:8px;align-items:center"><div style="width:40px;height:40px;background:#E53935;border:3px solid #000;border-radius:10px;display:flex;justify-content:center;align-items:center;color:white;font-size:22px">A</div><b>ABC KIDS</b></div>
<div style="background:#000;color:#FFEB3B;padding:5px 8px;border-radius:6px;font-size:10px">TANPA IKLAN</div>
</header>
<div class="top-bar" id="letters"></div>
<div id="canvas-wrap">
<div class="stars"><span class="star" id="s1">⭐</span><span class="star" id="s2">⭐</span><span class="star" id="s3">⭐</span></div>
<div id="guide">A</div>
<canvas id="c"></canvas>
<div id="object-area"><span><b id="word">A untuk Apel</b></span><span id="emoji" style="font-size:28px">🍎</span></div>
<div id="win" class="hide"><h2>HEBAT! 🎉</h2><button class="btn btn-next" style="width:160px;margin-top:12px" onclick="nextLetter()">LANJUT ▶</button></div>
</div>
<div class="controls">
<button class="btn btn-clear" onclick="clearCanvas()">HAPUS</button>
<button class="btn btn-sound" onclick="playSound()">🔊 SUARA</button>
<button class="btn btn-next" onclick="nextLetter()">NEXT ▶</button>
</div>
</div>
<script>
const DATA={A:{word:"A untuk Apel",emoji:"🍎",phon:"A untuk Apel",color:"#E53935"},B:{word:"B untuk Bola",emoji:"⚽",phon:"B untuk Bola",color:"#1E88E5"},C:{word:"C untuk Ceri",emoji:"🍒",phon:"C untuk Ceri",color:"#43A047"},D:{word:"D untuk Domba",emoji:"🐑",phon:"D untuk Domba",color:"#FB8C00"},E:{word:"E untuk Elang",emoji:"🦅",phon:"E untuk Elang",color:"#8E24AA"},F:{word:"F untuk Flamingo",emoji:"🦩",phon:"F untuk Flamingo",color:"#EC407A"},G:{word:"G untuk Gajah",emoji:"🐘",phon:"G untuk Gajah",color:"#6D4C41"},H:{word:"H untuk Harimau",emoji:"🐯",phon:"H untuk Harimau",color:"#F4511E"},I:{word:"I untuk Ikan",emoji:"🐟",phon:"I untuk Ikan",color:"#00ACC1"},J:{word:"J untuk Jerapah",emoji:"🦒",phon:"J untuk Jerapah",color:"#FFCA28"},K:{word:"K untuk Kucing",emoji:"🐱",phon:"K untuk Kucing",color:"#7CB342"},L:{word:"L untuk Lion",emoji:"🦁",phon:"L untuk Lion",color:"#FFA000"},M:{word:"M untuk Monyet",emoji:"🐒",phon:"M untuk Monyet",color:"#8D6E63"},N:{word:"N untuk Naga",emoji:"🐉",phon:"N untuk Naga",color:"#5E35B1"},O:{word:"O untuk Oren",emoji:"🍊",phon:"O untuk Oren",color:"#FF6F00"},P:{word:"P untuk Panda",emoji:"🐼",phon:"P untuk Panda",color:"#000"},Q:{word:"Q untuk Quail",emoji:"🐦",phon:"Q untuk Quail",color:"#3949AB"},R:{word:"R untuk Rusa",emoji:"🦌",phon:"R untuk Rusa",color:"#A1887F"},S:{word:"S untuk Semangka",emoji:"🍉",phon:"S untuk Semangka",color:"#2E7D32"},T:{word:"T untuk Tiger",emoji:"🐅",phon:"T untuk Tiger",color:"#EF6C00"},U:{word:"U untuk Ular",emoji:"🐍",phon:"U untuk Ular",color:"#43A047"},V:{word:"V untuk Violin",emoji:"🎻",phon:"V untuk Violin",color:"#6A1B9A"},W:{word:"W untuk Wortel",emoji:"🥕",phon:"W untuk Wortel",color:"#FF5722"},X:{word:"X untuk Xylofon",emoji:"🎼",phon:"X untuk Xylofon",color:"#00897B"},Y:{word:"Y untuk Yoyo",emoji:"🪀",phon:"Y untuk Yoyo",color:"#FBC02D"},Z:{word:"Z untuk Zebra",emoji:"🦓",phon:"Z untuk Zebra",color:"#212121"}};
let cur='A',isDrawing=false,points=0,need=70;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),guide=document.getElementById('guide'),wordEl=document.getElementById('word'),emojiEl=document.getElementById('emoji'),winEl=document.getElementById('win'),intro=document.getElementById('intro');

document.getElementById('playBtn').addEventListener('click',function(){
 intro.classList.add('hide');
 setTimeout(()=>{resize();loadLetter(cur);playSound();},100);
});

function resize(){let r=canvas.parentElement.getBoundingClientRect();canvas.width=r.width*2;canvas.height=r.height*2;ctx.lineCap='round';ctx.lineJoin='round';clearCanvas();}
function getPos(e){let rect=canvas.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return {x:(t.clientX-rect.left)*(canvas.width/rect.width), y:(t.clientY-rect.top)*(canvas.height/rect.height)}}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);points=0;updateStars();winEl.classList.add('hide');drawGuide();}
function drawGuide(){let d=DATA[cur];guide.textContent=cur;guide.style.color=d.color;ctx.save();ctx.setLineDash([18,18]);ctx.strokeStyle=d.color;ctx.lineWidth=12;ctx.globalAlpha=0.25;ctx.font=`${canvas.height*0.45}px Fredoka`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(cur,canvas.width/2,canvas.height/2-30);ctx.restore();}
function start(e){isDrawing=true;let p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
function move(e){if(!isDrawing)return;e.preventDefault();let p=getPos(e);ctx.lineWidth=22;ctx.strokeStyle=DATA[cur].color;ctx.globalAlpha=1;ctx.lineTo(p.x,p.y);ctx.stroke();points++;updateStars();if(points>need)checkWin();}
function end(){isDrawing=false;}
function updateStars(){let pct=points/need;document.getElementById('s1').classList.toggle('on',pct>0.25);document.getElementById('s2').classList.toggle('on',pct>0.55);document.getElementById('s3').classList.toggle('on',pct>0.85);}
function checkWin(){winEl.classList.remove('hide');playSound(true);}
function playSound(win=false){try{let u=new SpeechSynthesisUtterance(win?"Hore hebat! "+DATA[cur].phon:DATA[cur].phon);u.lang='id-ID';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function loadLetter(l){cur=l;wordEl.textContent=DATA[l].word;emojiEl.textContent=DATA[l].emoji;document.querySelectorAll('.letter-btn').forEach(b=>b.classList.toggle('active',b.dataset.l==l));clearCanvas();}
function nextLetter(){let k=Object.keys(DATA),i=k.indexOf(cur);loadLetter(k[(i+1)%k.length]);setTimeout(playSound,200);}
let bar=document.getElementById('letters');Object.keys(DATA).forEach(l=>{let b=document.createElement('div');b.className='letter-btn';b.dataset.l=l;b.textContent=l;b.onclick=()=>{loadLetter(l);playSound();};bar.appendChild(b);});
canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);canvas.addEventListener('mouseleave',end);
canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
window.addEventListener('resize',()=>{if(intro.classList.contains('hide')) resize();});
loadLetter('A');
</script>
</body>
</html>
